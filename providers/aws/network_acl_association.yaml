# aws_network_acl_association -> an edge, not a node. Real AWS semantic, verified
# against docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html: "a subnet can
# be associated with only one network ACL at a time" — an explicit association
# resource is exactly that fact made real in the IR, the same pattern
# route_table_association.yaml already established for route tables.
resource_type: aws_network_acl_association
edge:
  type: depends_on
  from_attribute: subnet_id
  to_attribute: network_acl_id
