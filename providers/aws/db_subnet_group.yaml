# aws_db_subnet_group -> network_boundary. PC-80: RDS references its subnets
# INDIRECTLY, by name (db_subnet_group_name = aws_db_subnet_group.payments.name), not
# directly by subnet ID — without this resource mapped, that reference pointed at an
# out-of-vocabulary resource and was silently skipped by ingest/build.go's own
# buildEdges (a real, present resource just outside the golden vocabulary, not a
# dangling reference — see that function's own doc comment for why that case
# produces no edge at all rather than an unresolved one). RDS's real containment
# placement (which AZs its data actually lives in) was consequently invisible to
# zone-kill: AZ loss against the data tier came back not_assessable, honestly, but
# for the wrong reason — not because the data was unaffected, but because the graph
# had no path from the killed subnet to the database at all.
#
# Mapped as network_boundary — the same node type aws_subnet itself uses, and for the
# same reason: this resource is a real containment level (subnet_ids is a list of the
# subnets it groups), not a component with its own failure mode. node_type here is a
# real design choice: a subnet_group has no capability that maps to CapabilityModel
# (no encryption/failover/replication semantics of its own — it is pure grouping), so
# treating it as its own distinct node type would need a new one this scenario does
# not require (PRD §4's scenario-driven minimalism) — network_boundary already exists
# and already means "a containment level with no component-level failure mode of its
# own", which is exactly what this is.
#
# reference_edge_type: contained_in means BOTH directions of this resource's real role
# work via the same generic mechanism subnet.yaml already established, with zero new
# ingest code: (1) aws_db_instance.payments -> aws_db_subnet_group.payments becomes a
# real contained_in edge (RDS references the group by name, ingest's own reference
# walker does not care which trailing attribute follows the resource reference — see
# ingest/parse.go's resourceRefFromTraversal, generic by construction); (2)
# aws_db_subnet_group.payments -> aws_subnet.data_a/b/c become real contained_in
# edges (the group's own subnet_ids list, walked the same generic way). Two real hops,
# both produced by the existing generic reference-to-edge mechanism — confirmed by
# reading core/internal/analyse/containment.go's ContainmentBlastRadius directly: it
# is a real multi-hop BFS over reverse containment adjacency, not a single-hop lookup,
# so this two-hop chain resolves correctly with no changes to that engine either.
resource_type: aws_db_subnet_group
node_type: network_boundary
reference_edge_type: contained_in

capability_level: CONNECTIVITY

# PC-158: attributes the engine reads. Declared but unreadable (a variable, a function, or something
# outside this bundle) is recorded on the node, and the result that depends on it is not_assessable.
unresolved_matters:
  - attribute: subnet_ids
    affects: placement

