# No capabilities declared: a VPC has no field that maps onto CapabilityModel's fixed
# shape (replication mode, failover mechanism, etc. are all meaningless for a VPC
# itself) — this is not an oversight, there is genuinely nothing to declare.
resource_type: aws_vpc
node_type: network_boundary
reference_edge_type: contained_in
