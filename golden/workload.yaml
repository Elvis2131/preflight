# Declared workload (NFRs) for the golden reference architecture.
#
# RESHAPED to match core.Workload, the schema PC-7 froze (contracts/workload.schema.json).
# The original version of this file predated PC-7 and used a shape derived only from
# CLAUDE.md §14, with its own header stating "when PC-7 freezes the workload schema,
# this file is validated against it and reshaped if they disagree — the schema wins,
# not this file." PC-7 landed; this reshape is that promise being kept, not new scope.

schema_version: "1.0.0"

name: payments-api
criticality: tier1
data_classification: PCI
regions:
  - eu-west-1
compliance_profiles:
  - PCI

# CLAUDE.md §14: 99.95%, RTO 60s, RPO 0. Each becomes a `hard` requirement per PRD §4
# ("hard = constraint, violation is a failing finding") — none of these are goals to
# trade against.
requirements:
  - id: availability.target
    value: 99.95
    priority: hard
  - id: rto_seconds
    value: 60
    priority: hard
  - id: rpo_seconds
    value: 0
    priority: hard

# Per-node-type declared capacity. "app_node_rps" is PRE-EXISTING and load-bearing —
# core/simulate.go's own /simulate capacity check hardcodes exactly that key (do not
# rename or remove it; core/simulate_golden_test.go depends on it being declared here).
# The rest are new, added under PC-124's own recorded convention
# (core.JourneyCapacityKey: a node's canonical NodeType string, suffixed "_rps") so the
# "checkout" journey below can be fully assessed — a second, more general key scheme
# living alongside the older single-purpose one, not a second CAPACITY CONCEPT (the
# Card's own instruction was against a second field, not a second key name). Every
# OTHER node type (object_store, identity, external_dependency, ...) stays undeclared,
# so a capacity check against one of those is still correctly capacity_unknown.
capacity:
  app_node_rps: 500
  dns_rps: 1000
  load_balancer_rps: 2000
  container_workload_rps: 500
  managed_database_rps: 300
  queue/stream_rps: 200

# Declared user journeys (PC-124) — the Card's own example, against real golden node
# IDs. "checkout" is fully declared (every path component has a matching capacity
# entry above) — a real, positive EvaluateJourneyLoadReadiness case. "settlement"
# deliberately omits peak_rps/steady_rps — a real, checked not_assessable case
# (structural flow, PC-125, still works for it; load results do not), the same
# "golden fixtures include a checked not_assessable case" discipline PC-15's own
# findings fixtures already established.
journeys:
  - id: checkout
    name: "Checkout: internet -> ALB -> EKS -> RDS"
    path:
      - aws_route53_record.api
      - aws_lb.payments
      - aws_eks_cluster.payments
      - aws_db_instance.payments
    protocol: tcp
    port: 443
    criticality: tier1
    peak_rps: 800
    steady_rps: 500
  - id: settlement
    name: "Settlement: EKS -> SQS"
    path:
      - aws_eks_cluster.payments
      - aws_sqs_queue.settlement
    protocol: tcp
    port: 443
    criticality: tier1

# --- Everything below is NOT part of the frozen Workload schema -----------------------
#
# These fields predate PC-7 and do not correspond to any field core.Workload actually
# has (PRD §4 does not name entry_points/capabilities/scenarios/external_dependencies
# as Workload fields at all). They are kept here, clearly separated, as design
# reference rather than deleted outright — PC-12's MVG entry-point/stateful-node lists
# were cross-checked against `entry_points` below, and the six golden scenarios and
# external dependency are real product concepts (CLAUDE.md §14) that may deserve their
# own home once decided. A YAML loader that only reads the frozen fields above silently
# ignores everything past this line — that is intentional, not a parsing gap.

entry_points:
  - dns

capabilities:
  - dns
  - waf
  - load_balancer
  - container_workload
  - managed_database
  - cache
  - queue
  - identity

scenarios:
  - id: az_loss
    description: Loss of a single availability zone.
  - id: database_failure
    description: Primary managed database becomes unavailable.
  - id: queue_failure
    description: Settlement queue unavailable or accumulating poison messages.
  - id: identity_failure
    description: Workload credential revoked, expired, or compromised.
  - id: region_loss
    description: Loss of the primary region.
  - id: external_dependency_outage
    description: Upstream payment rail unavailable.

external_dependencies:
  - name: payment_rail
    description: Third-party card settlement network.
    criticality: hard
