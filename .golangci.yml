# golangci-lint config for Preflight's I1 "defense in depth" (CLAUDE.md §4 / ADR-004):
# core/'s purity (no I/O, no network, no LLM, no provider names, no clock, no
# unseeded randomness) is compiler-enforced for the internal/ boundary
# (core/boundary_test.go proves that half), but nothing in the Go compiler stops core/
# from *adding* an import of providers/ or calling time.Now() — that half is this file.
#
# NOT YET RUN. golangci-lint is not installed in this environment; this config has not
# been executed against the codebase. Treat it as a first draft to validate, not as a
# passing gate. Written against the v1 config schema (linters-settings.depguard /
# forbidigo) — confirm against whatever golangci-lint version CI actually installs, since
# v2 changed both sections' shape.

run:
  timeout: 3m

linters:
  enable:
    - depguard
    - forbidigo

linters-settings:
  depguard:
    rules:
      core-purity:
        # I1: core/ (and everything under core/internal/) must not import the impure
        # process packages, or reach for network/OS I/O directly.
        files:
          - "**/core/**/*.go"
        deny:
          - pkg: "preflight/ingest"
            desc: "I1 violation: core/ must not import ingest/ — ingest calls INTO core, never the reverse"
          - pkg: "preflight/reason"
            desc: "I1 violation: core/ must not import reason/ — LLM annotation is P2, outside the pure engine"
          - pkg: "preflight/server"
            desc: "I1 violation: core/ must not import server/ — the HTTP/MCP layer calls INTO core, never the reverse"
          - pkg: "preflight/providers"
            desc: "I1 violation: core/ must not import provider-specific code directly — provider data flows in as already-resolved IR, not as a live import"
          - pkg: "preflight/validate"
            desc: "I1 violation: core/ must not import validate/ — that package is P3, credentialed, and core/ must never be credentialed"
          - pkg: "net/http"
            desc: "I1 violation: core/ must not perform network I/O"
          - pkg: "net"
            desc: "I1 violation: core/ must not perform network I/O"
          - pkg: "os"
            desc: "I1 violation: core/ must not perform OS I/O (files, env vars, credentials)"

  forbidigo:
    forbid:
      - pattern: '^time\.Now$'
        pkg: "^preflight/core"
        msg: "I1 violation: core/ must not read the clock directly — accept time as an explicit parameter from the caller so results stay deterministic and replayable"
      - pattern: '^rand\.(Int|Int31|Int63|Float64|Float32|Intn|Seed)$'
        pkg: "^preflight/core"
        msg: "I1 violation: core/ must not use unseeded/global math/rand — accept an *rand.Rand constructed with an explicit seed from the caller"

issues:
  exclude-dirs:
    - zz_boundary_probe # core/boundary_test.go's scratch probe directory; always removed after the test runs, but excluded defensively
